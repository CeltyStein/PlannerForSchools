    :root {

      --text: #e2f2ff;

      --accent: #22d3ee;

      --neon-border: rgba(34,211,238,0.35);
      --neon-glow: 0 0 18px rgba(34,211,238,0.35), 0 0 44px rgba(34,211,238,0.2);
      --neon-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 24px rgba(34,211,238,0.25);
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:
        radial-gradient(circle at 20% 18%, rgba(34,211,238,.18), transparent 40%),
        radial-gradient(circle at 78% 6%, rgba(59,130,246,.16), transparent 36%),
        linear-gradient(180deg, #070b12 0%, #071423 42%, #05070b 100%);
      color: var(--text);
      color-scheme: dark;
      overflow: auto;
    }
    .glass {
      background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(0,0,0,0.22));
      border: 1px solid var(--neon-border);
      box-shadow: var(--neon-shadow), 0 0 0 1px rgba(34,211,238,0.16);
      backdrop-filter: blur(10px);
    }
    .exercise-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
      border: 1px solid rgba(34,211,238,0.16);
    }
    .exercise-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.45), 0 0 22px rgba(34,211,238,0.35);
      border-color: rgba(34,211,238,0.6);
    }
    .filter-btn {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 0 0 1px rgba(34,211,238,0.18);
    }
    .filter-btn:hover,
    .filter-btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(34,211,238,0.45), 0 0 16px rgba(34,211,238,0.35);
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(34,211,238,0.3), 0 0 18px rgba(34,211,238,0.25);
    }
    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .modal-backdrop { animation: fadeIn 0.25s ease; }
    .modal-content { animation: slideUp 0.28s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .pill-dot {
      width: 8px; height: 8px; border-radius: 999px; display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
  </style>
</head>

              <p style={{
                fontSize: `${config.font_size * 1.05}px`,
                color: config.secondary_action_color,
                fontFamily: `${config.font_family}, -apple-system, sans-serif`,
                margin: 0
              }}>
                {config.library_subtitle}
              </p>
            </header>

            <div className="glass" style={{ padding: '18px', borderRadius: '18px', marginBottom: '20px' }}>
              <input
                type="text"
                placeholder="Search exercises..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="search-input"
                style={{
                  width: '100%',
                  padding: '14px 16px',
                  background: config.surface_color,
                  border: `2px solid ${config.surface_color}`,
                  borderRadius: '12px',
                  color: config.text_color,
                  fontSize: `${config.font_size}px`,
                  fontFamily: `${config.font_family}, -apple-system, sans-serif`
                }}
              />
            </div>

            <div style={{ 
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fit,minmax(260px,1fr))',
              gap: '12px',
              alignItems: 'stretch',
              marginBottom: '18px'
            }}>
              <div className="glass" style={{ padding: '16px', borderRadius: '14px' }}>
                <p style={{ margin: '0 0 8px', color: config.secondary_action_color, fontSize: `${config.font_size * 0.8}px` }}>Muscle focus</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                  {['all', 'shoulders', 'chest', 'back', 'core', 'legs', 'mobility', 'full body', 'forearms'].map(muscle => (
                    <button
                      key={muscle}
                      onClick={() => setFilterMuscle(muscle)}
                      className="filter-btn"
                      style={{
                        padding: '10px 14px',
                        background: filterMuscle === muscle ? config.primary_action_color : config.surface_color,
                        color: filterMuscle === muscle ? '#0f0c14' : config.text_color,
                        border: 'none',
                        borderRadius: '10px',
                        cursor: 'pointer',
                        fontWeight: 600,
                        fontSize: `${config.font_size * 0.9}px`,
                        fontFamily: `${config.font_family}, -apple-system, sans-serif`,
                        textTransform: 'capitalize'
                      }}
                    >
                      {muscle}
                    </button>
                  ))}
                </div>
              </div>

              <div className="glass" style={{ padding: '16px', borderRadius: '14px' }}>
                <p style={{ margin: '0 0 8px', color: config.secondary_action_color, fontSize: `${config.font_size * 0.8}px` }}>Difficulty</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                  {['all', 'beginner', 'intermediate', 'advanced', 'expert'].map(difficulty => (
                    <button
                      key={difficulty}
                      onClick={() => setFilterDifficulty(difficulty)}
                      className="filter-btn"
                      style={{
                        padding: '10px 14px',
                        background: filterDifficulty === difficulty ? config.primary_action_color : config.surface_color,
                        color: filterDifficulty === difficulty ? '#0f0c14' : config.text_color,
                        border: 'none',
                        borderRadius: '10px',
                        cursor: 'pointer',
                        fontWeight: 600,
                        fontSize: `${config.font_size * 0.9}px`,
                        fontFamily: `${config.font_family}, -apple-system, sans-serif`,
                        textTransform: 'capitalize'
                      }}
                    >
                      {difficulty}
                    </button>
                  ))}
                </div>
              </div>

              <div className="glass" style={{ padding: '16px', borderRadius: '14px' }}>
                <p style={{ margin: '0 0 8px', color: config.secondary_action_color, fontSize: `${config.font_size * 0.8}px` }}>Exercise type</p>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                  {['all', 'calisthenics', 'weightlifting', 'warmup', 'yoga'].map(kind => (
                    <button
                      key={kind}
                      onClick={() => setFilterExerciseType(kind)}
                      className="filter-btn"
                      style={{
                        padding: '10px 14px',
                        background: filterExerciseType === kind ? config.primary_action_color : config.surface_color,
                        color: filterExerciseType === kind ? '#0f0c14' : config.text_color,
                        border: 'none',
                        borderRadius: '10px',
                        cursor: 'pointer',
                        fontWeight: 600,
                        fontSize: `${config.font_size * 0.9}px`,
                        fontFamily: `${config.font_family}, -apple-system, sans-serif`,
                        textTransform: 'capitalize'
                      }}
                    >
                      {kind}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              gap: '12px',
              flexWrap: 'wrap',
              marginBottom: '14px'
            }}>
              <p style={{
                margin: 0,
                fontSize: `${config.font_size * 0.9}px`,
                color: config.secondary_action_color,
                fontFamily: `${config.font_family}, -apple-system, sans-serif`
              }}>
                Showing {filteredExercises.length} exercise{filteredExercises.length !== 1 ? 's' : ''}
              </p>
              <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                {['beginner','intermediate','advanced','expert'].map(level => (
                  <span key={level} className="difficulty-badge glass" style={{
                    background: summary[level] ? `${config.primary_action_color}25` : 'rgba(255,255,255,0.05)',
                    color: summary[level] ? config.text_color : config.secondary_action_color,
                    border: summary[level] ? `1px solid ${config.primary_action_color}55` : '1px solid rgba(255,255,255,0.06)'
                  }}>
                    {level}: {summary[level] || 0}
                  </span>
                ))}
              </div>
            </div>

            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))',
              gap: '18px'
            }}>
              {filteredExercises.map(exercise => (
                <ExerciseCard
                  key={exercise.id}
                  exercise={exercise}
                  onClick={() => setSelectedExercise(exercise)}
                  config={config}
                />
              ))}
            </div>

            {filteredExercises.length === 0 && (
              <div className="glass" style={{
                textAlign: 'center',
                padding: '60px 20px',
                color: config.secondary_action_color,
                borderRadius: '14px',
                marginTop: '20px'
              }}>
                <p style={{
                  fontSize: `${config.font_size * 1.1}px`,
                  fontFamily: `${config.font_family}, -apple-system, sans-serif`,
                  margin: 0
                }}>
                  No exercises found. Try adjusting your filters.
                </p>
              </div>
            )}
          </div>

          {selectedExercise && (
            <ExerciseModal
              exercise={selectedExercise}
              onClose={() => setSelectedExercise(null)}
              config={config}
            />
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
